<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDYAIDAPP - Core Subject Quiz (50 Q)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div id="app-container" class="w-full max-w-4xl bg-white rounded-xl shadow-2xl p-6 md:p-10 border border-gray-100 min-h-[700px] flex flex-col">
        
        <header class="mb-6 pb-4 border-b border-indigo-100">
            <h1 class="text-3xl font-extrabold text-indigo-700">STUDYAIDAPP Quiz</h1>
            <p id="user-display" class="text-sm text-gray-500 mt-1">Please enter your details to begin.</p>
        </header>

        <main id="app-content" class="flex-grow flex flex-col items-center justify-center">
            <div class="flex-grow flex items-center justify-center flex-col">
                <span data-lucide="loader-circle" class="w-10 h-10 text-indigo-500 animate-spin mb-3"></span>
                <p class="text-gray-500 font-medium">Loading application...</p>
            </div>
        </main>

        <footer id="footer-message" class="mt-6 pt-4 border-t border-gray-100 text-center text-sm text-gray-400">
            <p>Ready to learn and test your knowledge!</p>
        </footer>
    </div>

    <script src="script.js"></script>

</body>
</html>
